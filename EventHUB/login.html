<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | EventHUB</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>

<link rel="icon" type="image/png" href="./assets/favicon.png">

<body class="auth-page auth-page-final">
  <main class="login-shell-final">
    <section class="login-card-final">
      <div class="login-logo-area">
        <img src="./assets/logoeventhub.png" alt="Logo EventHUB" class="login-logo-final" />
      </div>

      <div class="auth-tabs login-tabs-final">
        <button type="button" class="auth-tab active" data-auth-tab="login">Entrar</button>
        <button type="button" class="auth-tab" data-auth-tab="cadastro">Criar conta</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="section-head auth-center-head">
          <h2>Acesse sua conta</h2>
          <p>Entre para gerenciar estoque, locações, clientes e movimentações.</p>
        </div>

        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="usuario@empresa.com" autocomplete="email" required />

        <label for="senha">Senha</label>
        <input id="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required />

        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <p id="mensagem" class="message"></p>
      </form>

      <form id="cadastro-form" class="auth-form hidden">
        <div class="section-head auth-center-head">
          <h2>Criar conta</h2>
          <p>Cadastre um usuário para acessar o painel EventHUB.</p>
        </div>

        <label for="cadastro-nome">Nome</label>
        <input id="cadastro-nome" type="text" placeholder="Seu nome" autocomplete="name" required />

        <label for="cadastro-email">E-mail</label>
        <input id="cadastro-email" type="email" placeholder="seuemail@exemplo.com" autocomplete="email" required />

        <label for="cadastro-senha">Senha</label>
        <input id="cadastro-senha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password"
          required />

        <button type="submit" class="btn btn-primary btn-block">Cadastrar</button>
        <p id="mensagem-cadastro" class="message"></p>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/supabaseClient.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/login.js"></script>
</body>

</html>
